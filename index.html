<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Golf Tablet Scoring</title>
  <style>
    :root {
      --bg: #04100a;
      --panel: rgba(3, 11, 7, .88);
      --panel-2: rgba(7, 20, 13, .92);
      --line: #1f7d43;
      --line-soft: rgba(69, 164, 96, .45);
      --green: #1fb756;
      --green-2: #14893f;
      --green-3: #2ce06a;
      --red: #b74834;
      --ink: #e8f2ec;
      --muted: #88a596;
      --cell: #cbd7e8;
      --cell-focus: #e7effa;
      --dark-cell: #0b1710;
      --blue: #1377ff;
      --shadow: 0 14px 40px rgba(0,0,0,.38);
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% -20%, rgba(36, 151, 75, .23), transparent 38%), var(--bg);
      color: var(--ink);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      background: linear-gradient(180deg, #0e1d13, #06110b);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(44,224,106,.35); outline-offset: 2px; }

    .primary {
      background: linear-gradient(180deg, #25bf5c, #148840);
      border-color: #35df70;
      color: #ecfff3;
      font-weight: 700;
    }

    .danger {
      background: linear-gradient(180deg, #c85842, #8f2e22);
      border-color: rgba(255, 127, 101, .55);
      color: #fff2ee;
      font-weight: 800;
    }

    .ghost {
      background: rgba(0,0,0,.35);
      color: var(--muted);
    }

    .app {
      width: 100vw;
      height: 100vh;
      min-width: 980px;
      min-height: 620px;
      display: grid;
      grid-template-rows: 26px 64px 1fr;
      background: linear-gradient(180deg, rgba(14, 61, 28, .16), transparent 34%), #06110b;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      height: 26px;
      background: linear-gradient(90deg, #17803a, #0f632c);
      color: rgba(255,255,255,.82);
      font-size: 12px;
      letter-spacing: .03em;
    }

    .topbar {
      display: grid;
      grid-template-columns: 180px minmax(230px, 1fr) auto auto auto auto auto auto 54px 36px;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: rgba(1, 6, 4, .9);
      border-bottom: 1px solid rgba(42, 158, 76, .7);
      box-shadow: var(--shadow);
    }

    .course-btn { text-align: left; color: #b8d3c3; }
    .title {
      color: var(--green-3);
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 4px;
    }

    .pill {
      min-height: 42px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      background: #08130d;
      color: #cde2d7;
      padding: 0 12px;
      white-space: nowrap;
      font-weight: 650;
    }

    .topbar button { white-space: nowrap; min-height: 42px; }
    .tab-label { color: #9fb9ac; text-align: center; font-weight: 700; }
    .unit { color: #9fb9ac; text-align: center; }

    .main {
      display: grid;
      grid-template-columns: minmax(410px, 43%) 1fr;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .map-card, .distance-card, .score-wrap, .hole-editor {
      border: 1px solid rgba(46, 150, 78, .75);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .map-card {
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      background:
        radial-gradient(ellipse at 49% 14%, rgba(216,218,194,.9) 0 4%, transparent 4.3%),
        radial-gradient(ellipse at 82% 18%, rgba(218,219,198,.78) 0 6%, transparent 6.4%),
        radial-gradient(ellipse at 72% 44%, rgba(218,219,198,.72) 0 5%, transparent 5.4%),
        radial-gradient(ellipse at 24% 27%, rgba(218,219,198,.72) 0 4%, transparent 4.4%),
        radial-gradient(ellipse at 54% 48%, rgba(62,130,64,.88) 0 19%, transparent 20%),
        linear-gradient(104deg, rgba(36,58,42,.95) 0 21%, rgba(71,111,64,.8) 21% 33%, rgba(67,119,66,.96) 33% 65%, rgba(29,62,40,.95) 65% 100%);
    }

    #map::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.42) 0 18%, transparent 18% 75%, rgba(0,0,0,.28) 75%),
        radial-gradient(circle at 18% 70%, rgba(6,26,14,.86) 0 15%, transparent 16%),
        radial-gradient(circle at 83% 70%, rgba(7,30,16,.75) 0 17%, transparent 18%),
        repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    #map::after {
      content: "Fallback map · add Google Maps key for live satellite";
      position: absolute;
      left: 10px;
      bottom: 8px;
      color: rgba(255,255,255,.62);
      font-size: 11px;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }

    #googleMap {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      background: #102015;
    }

    #map.google-active { background: #102015; }
    #map.google-active #googleMap { display: block; }
    #map.google-active::before,
    #map.google-active::after { display: none; }
    #map.google-active .overlay,
    #map.google-active #distLabels,
    #map.google-active #markerLayer { display: none; }

    .gps-panel {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 8;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid rgba(46, 150, 78, .65);
      border-radius: 10px;
      background: rgba(3, 11, 7, .86);
      backdrop-filter: blur(8px);
      color: #dff8e7;
      font-size: 12px;
    }
    .gps-status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gps-panel button { min-height: 34px; padding: 6px 10px; font-size: 12px; }

    .map-tool, .map-layer {
      position: absolute;
      z-index: 3;
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: rgba(218, 229, 237, .9);
      color: #1e2a35;
      border-color: rgba(255,255,255,.5);
    }
    .map-tool { right: 10px; top: 10px; }
    .map-layer { left: 10px; top: 10px; border-radius: 50%; }

    .marker {
      position: absolute;
      z-index: 5;
      width: 26px;
      height: 26px;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 4px 3px rgba(0,0,0,.6));
      pointer-events: none;
    }
    .marker::before {
      content: "";
      position: absolute;
      inset: 1px 3px 7px;
      background: #d6452e;
      border: 2px solid rgba(76, 13, 7, .35);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
    }
    .marker::after {
      content: "";
      position: absolute;
      width: 7px; height: 7px;
      left: 9px; top: 7px;
      border-radius: 50%;
      background: rgba(71, 16, 9, .58);
    }
    .marker.tee::before { background: #dc432d; }
    .marker.green::before { background: #db3928; }
    .marker.layup::before { background: #e8b634; }
    .marker.you::before { background: #2a92ff; }

    svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
    .dist-label {
      position: absolute;
      z-index: 6;
      transform: translate(-50%, -50%);
      padding: 3px 7px;
      background: rgba(4,11,8,.88);
      border: 1px solid rgba(38,125,238,.75);
      border-radius: 7px;
      color: #b7d4ff;
      font-size: 12px;
      font-weight: 800;
      text-shadow: 0 1px 1px #000;
    }

    .side {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .top-panels {
      display: grid;
      grid-template-columns: minmax(330px, 1.15fr) minmax(260px, .85fr);
      gap: 10px;
    }

    .distance-card { padding: 13px 14px; }
    .section-title {
      color: #2ed968;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .distance-grid {
      display: grid;
      gap: 5px;
      font-size: clamp(20px, 2.25vw, 27px);
      line-height: 1.1;
      color: #d9e6df;
      letter-spacing: .01em;
    }
    .distance-grid .divider { height: 1px; background: rgba(159,185,172,.25); margin: 5px 0; }
    .muted { color: #a5b6ad; }

    .controls {
      display: grid;
      grid-template-rows: repeat(3, 1fr) 1fr;
      gap: 9px;
    }

    .controls button { width: 100%; }
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .score-wrap {
      min-height: 0;
      overflow: auto;
      padding: 8px 9px 10px;
    }

    .score-head, .score-row {
      display: grid;
      grid-template-columns: 38px minmax(156px, 1.7fr) 66px 70px 70px 70px 70px 80px 70px;
      gap: 7px;
      align-items: end;
      min-width: 790px;
    }

    .score-head {
      color: #9cb5a8;
      font-weight: 800;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .group {
      text-align: center;
      border: 1px solid rgba(105, 139, 123, .35);
      border-bottom: 0;
      border-radius: 10px 10px 0 0;
      height: 30px;
      display: grid;
      place-items: center;
      color: #718478;
    }
    .group.hole { grid-column: 4 / 6; }
    .group.total { grid-column: 6 / 10; }
    .label-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 38px minmax(156px, 1.7fr) 66px 70px 70px 70px 70px 80px 70px;
      gap: 7px;
      align-items: center;
    }

    .score-row {
      margin: 7px 0;
      align-items: center;
    }

    .mini-btn {
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
      justify-self: center;
    }

    .name-input {
      background: linear-gradient(180deg, #25be5b, #12863c);
      color: white;
      border: 1px solid #3fe173;
      border-radius: 9px;
      min-height: 45px;
      text-align: center;
      padding: 8px 10px;
      font-weight: 750;
      width: 100%;
    }

    .score-input, .readonly-cell, .hole-select, .number-input {
      min-height: 52px;
      width: 100%;
      border-radius: 9px;
      border: 1px solid #526273;
      background: linear-gradient(180deg, var(--cell-focus), var(--cell));
      color: #0f172a;
      text-align: center;
      font-size: 20px;
      font-weight: 850;
      padding: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.22);
    }

    .readonly-cell {
      display: grid;
      place-items: center;
    }

    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button,
    .number-input::-webkit-outer-spin-button,
    .number-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .hole-editor {
      display: grid;
      grid-template-columns: 1fr 110px 110px 145px minmax(210px, .8fr) 112px 112px;
      gap: 8px;
      align-items: end;
      padding: 10px;
    }
    .field label { display:block; color: #91aa9d; font-size: 12px; margin: 0 0 4px; font-weight: 800; }
    .field input, .field select {
      width: 100%; min-height: 44px; border-radius: 8px;
      border: 1px solid rgba(69,164,96,.45);
      background: #08140d; color: var(--ink); padding: 8px 10px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 99;
      padding: 12px 16px;
      background: rgba(9, 25, 15, .96);
      border: 1px solid rgba(58, 203, 102, .7);
      color: #dff8e7;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: .22s ease;
      pointer-events: none;
      font-weight: 700;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .active-mode { box-shadow: 0 0 0 3px rgba(44,224,106,.35), inset 0 1px 0 rgba(255,255,255,.2); }

    #authBar { display: flex; align-items: center; gap: 8px; }
    #authBar button { min-height: 22px; padding: 2px 10px; font-size: 12px; border-radius: 6px; }
    #authBar .auth-email { color: rgba(255,255,255,.92); font-weight: 700; }

    button:disabled { opacity: .45; cursor: not-allowed; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 14px; min-width: 340px; max-width: 92vw;
      max-height: 86vh; overflow: auto; box-shadow: var(--shadow);
      color: var(--ink); padding: 18px;
    }
    .modal h2 { margin: 0 0 12px; font-size: 18px; }
    .modal .modal-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .modal label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 700; }
    .modal input, .modal select {
      width: 100%; min-height: 42px; border-radius: 8px;
      border: 1px solid var(--line-soft); background: #08140d;
      color: var(--ink); padding: 8px 10px;
    }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .game-row {
      display: grid; grid-template-columns: 1fr auto auto;
      gap: 8px; align-items: center; padding: 8px;
      border: 1px solid var(--line-soft); border-radius: 8px; margin-bottom: 6px;
    }
    .game-title { font-weight: 700; }
    .game-sub { font-size: 12px; color: var(--muted); }
    .empty { color: var(--muted); text-align: center; padding: 20px; }

    @media (max-width: 1050px) {
      .topbar { grid-template-columns: 155px 1fr auto auto auto 92px 92px 92px 42px 28px; gap: 5px; }
      .topbar button, .pill { padding-inline: 8px; font-size: 12px; }
      .main { grid-template-columns: 42% 58%; gap: 8px; padding: 8px; }
      .distance-grid { font-size: 20px; }
      .score-head, .score-row, .label-row { grid-template-columns: 34px 145px 58px 62px 62px 62px 62px 70px 62px; gap: 5px; min-width: 650px; }
      .score-input, .readonly-cell, .number-input { min-height: 47px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="statusbar">
      <div id="clock">4:42</div>
      <div id="authBar">
        <div id="signedOutControls" style="display:flex;gap:8px;align-items:center;">
          <button id="signInBtn" class="primary">Sign in</button>
        </div>
        <div id="signedInControls" style="display:none;gap:8px;align-items:center;">
          <span class="auth-email" id="authEmail"></span>
          <button id="signOutBtn" class="ghost">Sign out</button>
        </div>
      </div>
    </div>

    <header class="topbar">
      <button class="course-btn" id="courseBtn">Course: Paarl-Winelands</button>
      <div class="title" id="title">Paarl-Winelands · Hole 1</div>
      <div class="pill" id="parPill">Par 5</div>
      <div class="pill" id="siPill">SI 8</div>
      <div class="pill" id="modePill">Stroke Play</div>
      <button id="newGame">New Game</button>
      <button id="saveGame">Save Game</button>
      <button id="loadGame">Load Game</button>
      <div class="tab-label">Card</div>
      <div class="unit">m</div>
    </header>

    <main class="main">
      <section class="map-card" aria-label="Hole map">
        <div id="map">
          <div id="googleMap" aria-label="Live Google satellite map"></div>
          <button class="map-layer" id="mapTypeBtn" title="Toggle map type">◒</button>
          <button class="map-tool" id="locateBtn" title="Start live GPS">⌖</button>
          <svg class="overlay" id="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
          <div id="distLabels"></div>
          <div id="markerLayer"></div>
          <div class="gps-panel">
            <div class="gps-status" id="gpsStatus">Google Maps not loaded · enter API key below</div>
            <button id="centerOnGps">Center GPS</button>
            <button id="stopGps">Stop GPS</button>
          </div>
        </div>
      </section>

      <section class="side">
        <div class="top-panels">
          <div class="distance-card">
            <div class="section-title">Distances</div>
            <div class="distance-grid">
              <div>Tee → Green: <span id="teeGreen">—</span></div>
              <div>Tee → Layup: <span id="teeLayup">—</span></div>
              <div>Layup → Green: <span id="layupGreen">—</span></div>
              <div class="divider"></div>
              <div>You → Green: <span id="youGreen">—</span></div>
              <div>You → Layup: <span id="youLayup">—</span></div>
            </div>
          </div>

          <div class="controls">
            <button class="primary" id="setTee">Set Tee</button>
            <button class="ghost" id="setLayup">Set Layup</button>
            <button class="ghost" id="clearLayup">Clear Layup</button>
            <div class="nav-row">
              <button class="primary" id="prevHole">&lt;&lt; Prev</button>
              <button class="primary" id="nextHole">Next &gt;&gt;</button>
            </div>
          </div>
        </div>

        <div class="score-wrap">
          <div class="score-head">
            <button class="mini-btn primary" id="addPlayer">+</button>
            <div>Name</div>
            <div>Hdcp</div>
            <div class="group hole">Hole</div>
            <div class="group total">Total</div>
            <div class="label-row">
              <div></div><div></div><div></div>
              <div>Score</div><div>Points</div>
              <div>Gross</div><div>Net</div><div>Points</div><div>Game</div>
            </div>
          </div>
          <div id="scoreRows"></div>
        </div>

        <div class="hole-editor">
          <div class="field">
            <label>Course name</label>
            <input id="courseName" value="Paarl-Winelands" />
          </div>
          <div class="field">
            <label>Par</label>
            <input class="number-input" id="holePar" type="number" min="3" max="6" value="5" />
          </div>
          <div class="field">
            <label>Stroke index</label>
            <input class="number-input" id="holeSi" type="number" min="1" max="18" value="8" />
          </div>
          <div class="field">
            <label>Map tap mode</label>
            <select id="tapMode">
              <option value="green">Set Green</option>
              <option value="tee">Set Tee</option>
              <option value="layup">Set Layup</option>
              <option value="you">Set You</option>
            </select>
          </div>
          <div class="field">
            <label>Google Maps API key</label>
            <input id="mapsApiKey" placeholder="Paste browser key once" autocomplete="off" />
          </div>
          <button class="primary" id="loadGoogleMaps">Load Maps</button>
          <button class="primary" id="startGps">Start GPS</button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="authModal">
    <div class="modal" role="dialog" aria-labelledby="authTitle">
      <h2 id="authTitle">Sign in</h2>
      <div class="modal-row">
        <div style="flex:1">
          <label for="authMode">Mode</label>
          <select id="authMode">
            <option value="signin">Sign in</option>
            <option value="signup">Create account</option>
          </select>
        </div>
      </div>
      <div class="modal-row">
        <div style="flex:1">
          <label for="authEmailInput">Email</label>
          <input id="authEmailInput" type="email" autocomplete="email" />
        </div>
      </div>
      <div class="modal-row">
        <div style="flex:1">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" autocomplete="current-password" />
        </div>
      </div>
      <div class="actions">
        <button class="ghost" id="authClose">Cancel</button>
        <button class="primary" id="authSubmit">Continue</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="loadModal">
    <div class="modal" role="dialog" aria-labelledby="loadTitle" style="min-width:480px;">
      <h2 id="loadTitle">Load saved game</h2>
      <div id="gameList"><div class="empty">Loading…</div></div>
      <div class="actions">
        <button class="ghost" id="loadClose">Close</button>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
