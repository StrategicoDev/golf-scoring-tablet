<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Golf Tablet Scoring</title>
  <style>
    :root {
      --bg: #04100a;
      --panel: rgba(3, 11, 7, .88);
      --panel-2: rgba(7, 20, 13, .92);
      --line: #1f7d43;
      --line-soft: rgba(69, 164, 96, .45);
      --green: #1fb756;
      --green-2: #14893f;
      --green-3: #2ce06a;
      --red: #b74834;
      --ink: #e8f2ec;
      --muted: #88a596;
      --cell: #cbd7e8;
      --cell-focus: #e7effa;
      --dark-cell: #0b1710;
      --blue: #1377ff;
      --shadow: 0 14px 40px rgba(0,0,0,.38);
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% -20%, rgba(36, 151, 75, .23), transparent 38%), var(--bg);
      color: var(--ink);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select {
      font: inherit;
    }

    button {
      min-height: 50px;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      background: linear-gradient(180deg, #0e1d13, #06110b);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      font-size: 16px;
      font-weight: 700;
    }

    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(44,224,106,.35); outline-offset: 2px; }

    .primary {
      background: linear-gradient(180deg, #25bf5c, #148840);
      border-color: #35df70;
      color: #ecfff3;
      font-weight: 700;
    }

    .danger {
      background: linear-gradient(180deg, #c85842, #8f2e22);
      border-color: rgba(255, 127, 101, .55);
      color: #fff2ee;
      font-weight: 800;
    }

    .ghost {
      background: rgba(0,0,0,.35);
      color: var(--muted);
    }

    .app {
      width: 100vw;
      height: 100vh;
      min-width: 980px;
      min-height: 600px;
      display: grid;
      grid-template-rows: 26px 60px 1fr;
      background: linear-gradient(180deg, rgba(14, 61, 28, .16), transparent 34%), #06110b;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      height: 26px;
      background: linear-gradient(90deg, #17803a, #0f632c);
      color: rgba(255,255,255,.82);
      font-size: 12px;
      letter-spacing: .03em;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto auto auto auto auto 56px 56px;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(1, 6, 4, .9);
      border-bottom: 1px solid rgba(42, 158, 76, .7);
      box-shadow: var(--shadow);
    }

    .title {
      color: var(--green-3);
      font-size: clamp(22px, 2.4vw, 28px);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 4px;
    }

    .pill {
      min-height: 50px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: #08130d;
      color: #cde2d7;
      padding: 0 14px;
      white-space: nowrap;
      font-weight: 800;
      font-size: 22px;
    }

    .topbar button { white-space: nowrap; min-height: 50px; font-size: 17px; font-weight: 800; padding: 8px 14px; }
    #unitsBtn, #gpsToggle { font-size: 19px; font-weight: 800; padding: 6px; }
    #gpsToggle.active { background: linear-gradient(180deg, #25bf5c, #148840); color: #ecfff3; border-color: #35df70; }

    .main {
      display: grid;
      grid-template-columns: minmax(410px, 43%) 1fr;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .map-card, .distance-card, .score-wrap {
      border: 1px solid rgba(46, 150, 78, .75);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .map-card {
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      background:
        radial-gradient(ellipse at 49% 14%, rgba(216,218,194,.9) 0 4%, transparent 4.3%),
        radial-gradient(ellipse at 82% 18%, rgba(218,219,198,.78) 0 6%, transparent 6.4%),
        radial-gradient(ellipse at 72% 44%, rgba(218,219,198,.72) 0 5%, transparent 5.4%),
        radial-gradient(ellipse at 24% 27%, rgba(218,219,198,.72) 0 4%, transparent 4.4%),
        radial-gradient(ellipse at 54% 48%, rgba(62,130,64,.88) 0 19%, transparent 20%),
        linear-gradient(104deg, rgba(36,58,42,.95) 0 21%, rgba(71,111,64,.8) 21% 33%, rgba(67,119,66,.96) 33% 65%, rgba(29,62,40,.95) 65% 100%);
    }

    #map::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.42) 0 18%, transparent 18% 75%, rgba(0,0,0,.28) 75%),
        radial-gradient(circle at 18% 70%, rgba(6,26,14,.86) 0 15%, transparent 16%),
        radial-gradient(circle at 83% 70%, rgba(7,30,16,.75) 0 17%, transparent 18%),
        repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    #map::after {
      content: "Fallback map · add Google Maps key for live satellite";
      position: absolute;
      left: 10px;
      bottom: 8px;
      color: rgba(255,255,255,.62);
      font-size: 11px;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }

    #googleMap {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      background: #102015;
    }

    #map.google-active { background: #102015; }
    #map.google-active #googleMap { display: block; }
    #map.google-active::before,
    #map.google-active::after { display: none; }
    #map.google-active .overlay,
    #map.google-active #distLabels,
    #map.google-active #markerLayer { display: none; }

    .map-tool, .map-layer {
      position: absolute;
      z-index: 3;
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: rgba(218, 229, 237, .9);
      color: #1e2a35;
      border-color: rgba(255,255,255,.5);
    }
    .map-tool { right: 10px; top: 10px; }
    .map-layer { left: 10px; top: 10px; border-radius: 50%; }

    .marker {
      position: absolute;
      z-index: 5;
      width: 26px;
      height: 26px;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 4px 3px rgba(0,0,0,.6));
      pointer-events: none;
    }
    .marker::before {
      content: "";
      position: absolute;
      inset: 1px 3px 7px;
      background: #d6452e;
      border: 2px solid rgba(76, 13, 7, .35);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
    }
    .marker::after {
      content: "";
      position: absolute;
      width: 7px; height: 7px;
      left: 9px; top: 7px;
      border-radius: 50%;
      background: rgba(71, 16, 9, .58);
    }
    .marker.tee::before { background: #dc432d; }
    .marker.green::before { background: #db3928; }
    .marker.layup::before { background: #e8b634; }
    .marker.you::before { background: #2a92ff; }

    svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
    .dist-label {
      position: absolute;
      z-index: 6;
      transform: translate(-50%, -50%);
      padding: 3px 7px;
      background: rgba(4,11,8,.88);
      border: 1px solid rgba(38,125,238,.75);
      border-radius: 7px;
      color: #b7d4ff;
      font-size: 12px;
      font-weight: 800;
      text-shadow: 0 1px 1px #000;
    }

    .side {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .top-panels {
      display: grid;
      grid-template-columns: minmax(330px, 1.15fr) minmax(260px, .85fr);
      gap: 10px;
    }

    .distance-card { padding: 13px 14px; }
    .section-title {
      color: #2ed968;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .distance-grid {
      display: grid;
      gap: 6px;
      font-size: clamp(22px, 2.4vw, 30px);
      line-height: 1.15;
      color: #d9e6df;
      letter-spacing: .01em;
      font-weight: 750;
    }
    .distance-grid .divider { height: 1px; background: rgba(159,185,172,.25); margin: 5px 0; }
    .clickable-distance { cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background .12s; }
    .clickable-distance:hover, .clickable-distance:active { background: rgba(46,150,78,.18); }
    .clickable-distance::after { content: " ▸"; color: #9cb5a8; font-size: .8em; }
    .muted { color: #a5b6ad; }

    .controls {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 9px;
    }

    .controls button { width: 100%; font-size: 18px; font-weight: 800; min-height: 58px; }
    .nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .nav-row button { font-size: 18px; }

    .topbar button { font-size: 15px; font-weight: 700; }

    .score-wrap {
      min-height: 0;
      overflow: auto;
      padding: 8px 9px 10px;
    }

    .score-head, .score-row {
      display: grid;
      grid-template-columns: 32px minmax(110px, 1.4fr) 56px 58px 56px 58px 58px 60px 58px;
      gap: 5px;
      align-items: end;
      min-width: 0;
    }

    .score-head {
      color: #9cb5a8;
      font-weight: 800;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .group {
      text-align: center;
      border: 1px solid rgba(105, 139, 123, .35);
      border-bottom: 0;
      border-radius: 10px 10px 0 0;
      height: 30px;
      display: grid;
      place-items: center;
      color: #718478;
    }
    .group.hole { grid-column: 4 / 6; }
    .group.total { grid-column: 6 / 10; }
    .label-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 32px minmax(110px, 1.4fr) 56px 58px 56px 58px 58px 60px 58px;
      gap: 5px;
      align-items: center;
    }

    .score-row {
      margin: 7px 0;
      align-items: center;
    }

    .mini-btn {
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
      justify-self: center;
    }

    .name-input {
      background: linear-gradient(180deg, #25be5b, #12863c);
      color: white;
      border: 1px solid #3fe173;
      border-radius: 9px;
      min-height: 45px;
      text-align: center;
      padding: 8px 10px;
      font-weight: 750;
      width: 100%;
    }

    .score-input, .readonly-cell, .hole-select, .number-input {
      min-height: 48px;
      width: 100%;
      border-radius: 9px;
      border: 1px solid #526273;
      background: linear-gradient(180deg, var(--cell-focus), var(--cell));
      color: #0f172a;
      text-align: center;
      font-size: 19px;
      font-weight: 850;
      padding: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.22);
    }

    .readonly-cell {
      display: grid;
      place-items: center;
    }

    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button,
    .number-input::-webkit-outer-spin-button,
    .number-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 99;
      padding: 12px 16px;
      background: rgba(9, 25, 15, .96);
      border: 1px solid rgba(58, 203, 102, .7);
      color: #dff8e7;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: .22s ease;
      pointer-events: none;
      font-weight: 700;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .active-mode { box-shadow: 0 0 0 3px rgba(44,224,106,.35), inset 0 1px 0 rgba(255,255,255,.2); }

    #authBar { display: flex; align-items: center; gap: 8px; }
    #authBar button { min-height: 22px; padding: 2px 10px; font-size: 12px; border-radius: 6px; }
    #authBar .auth-email { color: rgba(255,255,255,.92); font-weight: 700; }

    button:disabled { opacity: .45; cursor: not-allowed; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 14px; min-width: 340px; max-width: 92vw;
      max-height: 86vh; overflow: auto; box-shadow: var(--shadow);
      color: var(--ink); padding: 18px;
    }
    .modal h2 { margin: 0 0 12px; font-size: 18px; }
    .modal .modal-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .modal label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 700; }
    .modal input, .modal select {
      width: 100%; min-height: 42px; border-radius: 8px;
      border: 1px solid var(--line-soft); background: #08140d;
      color: var(--ink); padding: 8px 10px;
    }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

    /* Glare-friendly variant: high-contrast light theme for outdoor visibility. */
    .modal.glare {
      background: #f6f9f5;
      color: #0c1a12;
      border: 2px solid #176d33;
      min-width: min(640px, 96vw);
      max-width: 760px;
      padding: 26px 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
    }
    .modal.glare h2 {
      color: #0c4a22;
      font-size: 28px;
      font-weight: 900;
      margin: 0 0 18px;
      letter-spacing: .01em;
    }
    .modal.glare .modal-row { gap: 14px; margin-bottom: 16px; }
    .modal.glare label {
      color: #1c4a2c;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .modal.glare input, .modal.glare select {
      background: #ffffff;
      color: #0c1a12;
      border: 2px solid #1f7d43;
      min-height: 60px;
      padding: 10px 14px;
      font-size: 22px;
      font-weight: 700;
      border-radius: 10px;
    }
    .modal.glare select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, #1f7d43 50%), linear-gradient(135deg, #1f7d43 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 14px) 50%; background-size: 8px 8px, 8px 8px; background-repeat: no-repeat; padding-right: 36px; }
    .modal.glare .actions { gap: 12px; margin-top: 18px; }
    .modal.glare .actions button {
      min-height: 64px;
      font-size: 22px;
      font-weight: 900;
      padding: 10px 26px;
      border-radius: 12px;
      min-width: 140px;
    }
    .modal.glare .actions .primary {
      background: linear-gradient(180deg, #1ca84d, #0e6b30);
      border-color: #0a4f23;
      color: #ffffff;
    }
    .modal.glare .actions .ghost {
      background: #ffffff;
      color: #0c4a22;
      border: 2px solid #1f7d43;
    }
    .game-row {
      display: grid; grid-template-columns: 1fr auto auto;
      gap: 8px; align-items: center; padding: 8px;
      border: 1px solid var(--line-soft); border-radius: 8px; margin-bottom: 6px;
    }
    .game-title { font-weight: 700; }
    .game-sub { font-size: 12px; color: var(--muted); }
    .empty { color: var(--muted); text-align: center; padding: 20px; }

    .scorecard { border-collapse: collapse; width: 100%; color: var(--ink); font-size: 14px; }
    .scorecard th, .scorecard td {
      border: 1px solid rgba(46, 150, 78, .35);
      padding: 6px 8px; text-align: center; min-width: 36px;
    }
    .scorecard th { background: #08130d; color: #b8d3c3; font-weight: 800; }
    .scorecard .row-label { text-align: left; font-weight: 800; background: rgba(8,30,16,.7); }
    .scorecard tr.par-row td, .scorecard tr.si-row td { color: #9cb5a8; font-weight: 700; }
    .scorecard tr.totals td { background: rgba(8,30,16,.55); font-weight: 800; color: #e6f6ec; }
    .scorecard .out, .scorecard .in, .scorecard .tot { background: rgba(15,46,25,.7); font-weight: 800; }

    .game-status {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(46, 150, 78, .55);
      border-radius: 10px;
      background: rgba(8, 25, 14, .65);
      color: var(--ink);
    }
    .game-status .gs-title { color: #2ed968; font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .game-status .gs-row {
      display: grid; grid-template-columns: 1fr auto auto;
      gap: 10px; align-items: center;
      padding: 6px 0;
      border-top: 1px solid rgba(159,185,172,.18);
      font-size: 18px; font-weight: 700;
    }
    .game-status .gs-row:first-of-type { border-top: 0; }
    .game-status .gs-status-line {
      font-size: 22px; font-weight: 800; text-align: center; padding: 6px 0;
    }
    .game-status .gs-status-line .gs-mid { color: #9cb5a8; font-size: 14px; font-weight: 700; margin: 0 10px; }

    .mp-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1f7d43;
      align-items: stretch;
      min-height: 96px;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    .mp-side {
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }
    .mp-side .mp-name {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp-side .mp-sub {
      font-size: 13px;
      color: rgba(255,255,255,.85);
      font-weight: 700;
      letter-spacing: .04em;
    }
    .mp-side.left  { background: linear-gradient(135deg, #1c873d, #145e2a); text-align: left; }
    .mp-side.right { background: linear-gradient(225deg, #1c873d, #145e2a); text-align: right; align-items: flex-end; }
    .mp-side.trail { background: linear-gradient(135deg, #3c6376, #28465a); }
    .mp-side.right.trail { background: linear-gradient(225deg, #3c6376, #28465a); }
    .mp-side.tied  { background: linear-gradient(135deg, #1d3d4a, #0c2230); }
    .mp-side.right.tied { background: linear-gradient(225deg, #1d3d4a, #0c2230); }

    .mp-center {
      background: linear-gradient(180deg, #1b5fcc, #0e3683);
      color: #ffffff;
      padding: 10px 24px;
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 900;
      min-width: 132px;
    }
    .mp-center.done   { background: linear-gradient(180deg, #d49a16, #8a5e08); color: #fff8d8; }
    .mp-center.dormie { background: linear-gradient(180deg, #c4651e, #7e3e0d); color: #fff1d6; }
    .mp-center .mp-big { font-size: 30px; line-height: 1; letter-spacing: .04em; }
    .mp-center .mp-thru { font-size: 11px; margin-top: 6px; letter-spacing: .18em; color: rgba(255,255,255,.85); }
    .mp-center .mp-thru-num { font-size: 22px; line-height: 1; font-weight: 900; margin-top: 2px; }
    .game-status .lead { color: #2ce06a; }
    .game-status .trail { color: #e8b634; }
    .game-status .even { color: #cde2d7; }

    @media (max-width: 1200px) {
      .topbar { grid-template-columns: minmax(180px, 1fr) auto auto auto auto auto auto auto 48px 48px; gap: 6px; padding: 8px 10px; }
      .topbar button, .pill { padding-inline: 10px; font-size: 15px; min-height: 46px; }
      .pill { font-size: 19px; }
      .main { grid-template-columns: 44% 56%; gap: 8px; padding: 8px; }
      .distance-grid { font-size: clamp(20px, 2.4vw, 26px); }
      .score-head, .score-row, .label-row {
        grid-template-columns: 28px minmax(90px, 1.2fr) 50px 52px 50px 52px 52px 56px 52px;
        gap: 4px; min-width: 0;
      }
      .score-input, .readonly-cell, .number-input { min-height: 44px; font-size: 17px; }
      .controls button { font-size: 17px; min-height: 52px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="statusbar">
      <div id="clock">4:42</div>
      <div id="authBar">
        <div id="signedOutControls" style="display:flex;gap:8px;align-items:center;">
          <button id="signInBtn" class="primary">Sign in</button>
        </div>
        <div id="signedInControls" style="display:none;gap:8px;align-items:center;">
          <span class="auth-email" id="authEmail"></span>
          <button id="signOutBtn" class="ghost">Sign out</button>
        </div>
      </div>
    </div>

    <header class="topbar">
      <div class="title" id="title">Paarl-Winelands · Hole 1</div>
      <div class="pill" id="parPill">Par 5</div>
      <div class="pill" id="siPill">SI 8</div>
      <div class="pill" id="modePill">Stroke Play</div>
      <button id="newGame">New Game</button>
      <button id="saveGame">Save Game</button>
      <button id="loadGame">Load Game</button>
      <button class="primary" id="cardBtn">Card</button>
      <button id="gpsToggle" class="ghost" title="Toggle GPS" aria-label="Toggle GPS">📍</button>
      <button id="unitsBtn" class="ghost">m</button>
    </header>

    <main class="main">
      <section class="map-card" aria-label="Hole map">
        <div id="map">
          <div id="googleMap" aria-label="Live Google satellite map"></div>
          <button class="map-layer" id="mapTypeBtn" title="Toggle map type">◒</button>
          <button class="map-tool" id="locateBtn" title="Start live GPS">⌖</button>
          <svg class="overlay" id="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
          <div id="distLabels"></div>
          <div id="markerLayer"></div>
          <div id="gpsStatus" style="display:none"></div>
        </div>
      </section>

      <section class="side">
        <div class="top-panels">
          <div class="distance-card">
            <div class="section-title">Distances</div>
            <div class="distance-grid">
              <div>Green: <span id="youGreen">—</span></div>
              <div>Layup: <span id="youLayup">—</span></div>
              <div>Layup → Green: <span id="layupGreen">—</span></div>
              <div class="divider"></div>
              <div id="youTeeRow" class="clickable-distance">Tee: <span id="youTee">—</span></div>
              <span id="teeGreen" hidden></span>
              <span id="teeLayup" hidden></span>
            </div>
          </div>

          <div class="controls">
            <button class="primary" id="setTee">Set Tee</button>
            <button class="ghost" id="clearLayup">Clear Layup</button>
            <div class="nav-row">
              <button class="primary" id="prevHole">&lt;&lt; Prev</button>
              <button class="primary" id="nextHole">Next &gt;&gt;</button>
            </div>
          </div>
        </div>

        <div class="score-wrap">
          <div class="score-head">
            <button class="mini-btn primary" id="addPlayer">+</button>
            <div>Name</div>
            <div>Hdcp</div>
            <div class="group hole">Hole</div>
            <div class="group total">Total</div>
            <div class="label-row">
              <div></div><div></div><div></div>
              <div>Score</div><div>Points</div>
              <div>Gross</div><div>Net</div><div>Points</div><div>Game</div>
            </div>
          </div>
          <div id="scoreRows"></div>
          <div id="gameStatus" class="game-status"></div>
        </div>

      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="authModal">
    <div class="modal" role="dialog" aria-labelledby="authTitle">
      <h2 id="authTitle">Sign in</h2>
      <div class="modal-row">
        <div style="flex:1">
          <label for="authMode">Mode</label>
          <select id="authMode">
            <option value="signin">Sign in</option>
            <option value="signup">Create account</option>
          </select>
        </div>
      </div>
      <div class="modal-row">
        <div style="flex:1">
          <label for="authEmailInput">Email</label>
          <input id="authEmailInput" type="email" autocomplete="email" />
        </div>
      </div>
      <div class="modal-row">
        <div style="flex:1">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" autocomplete="current-password" />
        </div>
      </div>
      <div class="actions">
        <button class="ghost" id="authClose">Cancel</button>
        <button class="primary" id="authSubmit">Continue</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="driveModal">
    <div class="modal" role="dialog" aria-labelledby="driveTitle">
      <h2 id="driveTitle">Record drive</h2>
      <p style="margin: 0 0 12px; font-size: 18px;">
        Hole <span id="driveHole">—</span> ·
        Distance <strong id="driveDist">— m</strong>
      </p>
      <div id="driveList" style="display: grid; gap: 8px;"></div>
      <div class="actions"><button class="ghost" id="driveClose">Close</button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="cardModal">
    <div class="modal" role="dialog" aria-labelledby="cardTitle" style="min-width:min(96vw, 1100px); max-width: 96vw;">
      <h2 id="cardTitle">Scorecard</h2>
      <div id="cardBody" style="overflow:auto;"></div>
      <div class="actions">
        <button class="ghost" id="cardClose">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="newGameModal">
    <div class="modal glare" role="dialog" aria-labelledby="newGameTitle">
      <h2 id="newGameTitle">Start new game</h2>
      <div class="modal-row">
        <div style="flex:1">
          <label for="newGameMode">Game type</label>
          <select id="newGameMode"></select>
        </div>
        <div style="flex:1">
          <label for="newGameScoring">Scoring</label>
          <select id="newGameScoring"></select>
        </div>
      </div>
      <div class="modal-row">
        <div style="flex:1">
          <label for="newGameCourse">Course</label>
          <select id="newGameCourse"></select>
        </div>
        <div style="flex:1">
          <label for="newGameTeams">Teams (P1+P2 vs P3+P4)</label>
          <select id="newGameTeams">
            <option value="no">No</option>
            <option value="yes">Yes (best ball)</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="ghost" id="newGameClose">Cancel</button>
        <button class="primary" id="newGameStart">Start</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="loadModal">
    <div class="modal" role="dialog" aria-labelledby="loadTitle" style="min-width:480px;">
      <h2 id="loadTitle">Load saved game</h2>
      <div id="gameList"><div class="empty">Loading…</div></div>
      <div class="actions">
        <button class="ghost" id="loadClose">Close</button>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
